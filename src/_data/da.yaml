manifesto:
  index: Manifest / kort version
  heading:
    before: Det skal være sjovt at være
    emphasis: beredt.
  columns:
    - title: Vi tror på
      items:
        - Leg er den hurtigste vej til læring.
        - Børn og voksne lærer bedst sammen.
        - Man kan øve modstandskraft uden at være dyster.
    - title: Vi øver os i
      items:
        - At lodde, bygge og reparere.
        - At kommunikere, når nettet falder.
        - At spille os klogere.
  stamp:
    - Lidt grønnere
    - Lidt mere crypto
    - Lidt mere sammen

