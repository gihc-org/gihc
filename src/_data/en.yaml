  index: Manifesto / short version
  heading:
    before: It should be fun to be
    emphasis: prepared.
  columns:
    - title: We believe
      items:
        - Play is the fastest route to learning.
        - Children and adults learn best together.
        - We can practise resilience without being gloomy.
    - title: We practise
