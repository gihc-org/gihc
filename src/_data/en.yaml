principles:
  - number: "01"
    title: Play is serious
    text: Preparedness does not have to be dry, gloomy or expensive.
  - number: "02"
    title: Everyone can join
    text: Children and adults. Hands and heads. Curiosity before qualifications.
  - number: "03"
    title: Practise together
    text: It is easier to handle hardship when you know your neighbour.
  - number: "04"
    title: Build locally, share globally
    text: Each cell finds its own rhythm. We share the identity and the friendships.

scenarios:
  index: 01 / Scenarios
  heading:
    before: We prepare for
    emphasis: the second-worst.
  intro: Not doomsday. But the days, weeks or months when power, connectivity and supplies become a challenge. These situations can be managed if we have practised a little and know our neighbours.
  cards:
    - time: Days
      number: "01"
      title: Without power
      text: We cook over fire, light our homes without the switch and stay warm together.
      tags:
        - Fire
        - Food
        - Warmth
    - time: One week
      number: "02"
      title: Without internet
      text: Radio, mesh networks, maps and clear agreements with the people around us.
      tags:
        - Radio
        - Mesh
        - Messaging
      resource:
        label: Project
        title: GIHC Mini-Mesh
        href: https://mesh.gihc.online/
    - time: Six months
      number: "03"
      title: Under supply pressure
      text: We practise growing, fermenting, storing, repairing and sharing.
      tags:
        - Grow
        - Share
        - Repair
  note: It is not about fearing the future. It is about being a little more ready for it.

activities:
  index: 02 / Activities
  heading:
    before: Four ways to
    emphasis: practise
    after: "."
  intro: We meet in a regular venue, outdoors and through play. Sometimes with tools in hand. Other times with a radio, a map or a story.
  cards:
    - className: activity-workshops
      icon: workshop
      format: Format 01
      title: Workshops
      text: "Evenings where we build something tangible together: a solar charger, mesh radio, fermentation jar or a clay bread oven."
      detail: Children often get their own side mission.
    - className: activity-camps
      icon: camp
      format: Format 02
      title: Camps
      text: Weekends where we rehearse whole scenarios through play. A Saturday without power. A Sunday without GPS.
      detail: Tents, fire, radio and star maps.
    - className: activity-training
      icon: training
      format: Format 03
      title: Ongoing training
      text: A regular weekly rhythm with gymnastics, running and rotating modules in physical and digital first aid.
      detail: Our bodies should be able to do more than sit in front of a screen.
    - className: activity-games
      icon: game
      format: Format 04
      title: Games
      text: "Role-playing and capture the flag, physical and digital. The scenario might be: “The neighbourhood has been offline for three days — what do we do?”"
      detail: We play ourselves wiser.
      resource:
        label: Inspiration
        title: CS Unplugged
        href: https://www.csunplugged.org/en/

hybrid:
  index: 03 / Hybrid Cleverness
  heading:
    before: Old knowledge meets
    emphasis: new tools.
  intro: We stand on the shoulders of the scout movement, hacker culture, the volunteer preparedness tradition, the green transition and decentralised networks. Not as contradictions — but as tools in the same toolbox.
  pairs:
    - left: Scout
      right: Hackerspace
    - left: Solar panels
      right: Resourcefulness
    - left: Hands
      right: Heads
    - left: Local cell
      right: Global community
  quote: Hybrid Cleverness is not an app. It is the ability to use our heads, hands and one another when it matters.

